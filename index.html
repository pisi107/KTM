<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Ordini KTM</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
        background: #f2f3f5;
        color: #1d1d1f;
        min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 250px;
        height: 100vh;
        background: #151515;
        color: white;
        padding: 25px 18px;
        z-index: 10;
    }

    .logo {
        font-size: 23px;
        font-weight: 800;
        margin-bottom: 5px;
    }

    .subtitle {
        color: #999;
        font-size: 12px;
        margin-bottom: 35px;
    }

    .menu-title {
        color: #777;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        margin: 20px 10px 8px;
    }

    .menu-btn {
        width: 100%;
        border: 0;
        background: transparent;
        color: #ddd;
        text-align: left;
        padding: 13px 14px;
        border-radius: 9px;
        margin-bottom: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    .menu-btn:hover {
        background: #292929;
    }

    .menu-btn.active {
        background: #ff5a00;
        color: white;
        font-weight: 700;
    }

    /* MAIN */

    .main {
        margin-left: 250px;
        padding: 30px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    .page-title {
        font-size: 30px;
        font-weight: 800;
    }

    .page-subtitle {
        color: #777;
        margin-top: 5px;
        font-size: 14px;
    }

    .add-btn {
        border: none;
        background: #ff5a00;
        color: white;
        padding: 13px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
    }

    .add-btn:hover {
        background: #e94f00;
    }

    /* CARDS */

    .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card-label {
        color: #777;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .card-value {
        font-size: 26px;
        font-weight: 800;
    }

    .card.orange .card-value {
        color: #ff5a00;
    }

    .card.green .card-value {
        color: #168542;
    }

    .card.blue .card-value {
        color: #2878d7;
    }

    /* PERSON CARDS */

    .people {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .person-card {
        background: white;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        cursor: pointer;
        transition: 0.2s;
    }

    .person-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .person-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .person-name {
        font-size: 24px;
        font-weight: 800;
    }

    .person-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #f1f1f1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }

    .person-money {
        font-size: 30px;
        font-weight: 800;
        color: #ff5a00;
        margin-bottom: 15px;
    }

    .person-stats {
        display: flex;
        gap: 20px;
        color: #777;
        font-size: 13px;
    }

    /* TABLE */

    .table-box {
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        overflow-x: auto;
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        gap: 15px;
    }

    .table-title {
        font-size: 20px;
        font-weight: 800;
    }

    .search {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px 12px;
        width: 230px;
        outline: none;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1000px;
    }

    th {
        text-align: left;
        font-size: 12px;
        color: #777;
        padding: 12px 8px;
        border-bottom: 1px solid #eee;
    }

    td {
        padding: 13px 8px;
        border-bottom: 1px solid #eee;
        font-size: 13px;
    }

    tr:hover td {
        background: #fafafa;
    }

    .money {
        font-weight: 700;
    }

    .status {
        display: inline-block;
        padding: 6px 9px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
    }

    .status.da-ordinare {
        background: #ffe3df;
        color: #d52b1e;
    }

    .status.ordinato {
        background: #fff0d5;
        color: #a86300;
    }

    .status.arrivato {
        background: #dff5e6;
        color: #168542;
    }

    .status.consegnato {
        background: #e0ecff;
        color: #2865b5;
    }

    .actions button {
        border: 0;
        background: #eee;
        padding: 6px 9px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 4px;
    }

    .actions button:hover {
        background: #ddd;
    }

    /* MODAL */

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }

    .modal-overlay.show {
        display: flex;
    }

    .modal {
        background: white;
        width: 600px;
        max-width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 18px;
        padding: 25px;
    }

    .modal-title {
        font-size: 23px;
        font-weight: 800;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        font-size: 12px;
        color: #666;
        font-weight: 600;
    }

    input,
    select {
        border: 1px solid #d8d8d8;
        border-radius: 8px;
        padding: 11px;
        outline: none;
        background: white;
    }

    input:focus,
    select:focus {
        border-color: #ff5a00;
    }

    .calculated {
        background: #f5f5f5;
        font-weight: 700;
    }

    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .cancel-btn,
    .save-btn {
        border: 0;
        padding: 11px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
    }

    .cancel-btn {
        background: #eee;
    }

    .save-btn {
        background: #ff5a00;
        color: white;
    }

    /* EMPTY */

    .empty {
        text-align: center;
        padding: 45px 20px;
        color: #888;
    }

    /* MOBILE */

    @media(max-width: 900px) {

        .sidebar {
            width: 70px;
            padding: 20px 10px;
        }

        .logo {
            font-size: 0;
            text-align: center;
        }

        .logo::after {
            content: "K";
            font-size: 25px;
        }

        .subtitle,
        .menu-title,
        .menu-btn span {
            display: none;
        }

        .menu-btn {
            text-align: center;
            padding: 13px 5px;
        }

        .main {
            margin-left: 70px;
            padding: 18px;
        }

        .cards {
            grid-template-columns: repeat(2, 1fr);
        }

        .people {
            grid-template-columns: 1fr;
        }
    }

    @media(max-width: 600px) {

        .topbar {
            align-items: flex-start;
            flex-direction: column;
            gap: 15px;
        }

        .page-title {
            font-size: 25px;
        }

        .cards {
            grid-template-columns: 1fr 1fr;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .search {
            width: 100%;
        }

        .table-header {
            flex-direction: column;
            align-items: stretch;
        }
    }
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">KTM ORDINI</div>
    <div class="subtitle">Gestione privata</div>

    <div class="menu-title">MENU</div>

    <button class="menu-btn active" onclick="showDashboard()">
        🏠 <span>Dashboard</span>
    </button>

    <button class="menu-btn" onclick="showPerson('Roby')">
        🔧 <span>Roby</span>
    </button>

    <button class="menu-btn" onclick="showPerson('Fede')">
        🛠️ <span>Fede</span>
    </button>

    <div class="menu-title">GESTIONE</div>

    <button class="menu-btn" onclick="openModal()">
        ➕ <span>Nuovo ordine</span>
    </button>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <div>
            <div class="page-title" id="pageTitle">
                Gestione Ordini KTM
            </div>

            <div class="page-subtitle" id="pageSubtitle">
                Controllo completo degli ordini di Roby e Fede
            </div>
        </div>

        <button class="add-btn" onclick="openModal()">
            + Nuovo ordine
        </button>

    </div>


    <!-- DASHBOARD -->

    <section id="dashboard">

        <div class="cards">

            <div class="card">
                <div class="card-label">Ordini totali</div>
                <div class="card-value" id="totalOrders">0</div>
            </div>

            <div class="card orange">
                <div class="card-label">Da ordinare</div>
                <div class="card-value" id="toOrder">0</div>
            </div>

            <div class="card green">
                <div class="card-label">Arrivati</div>
                <div class="card-value" id="arrived">0</div>
            </div>

            <div class="card blue">
                <div class="card-label">Consegnati</div>
                <div class="card-value" id="delivered">0</div>
            </div>

        </div>


        <div class="people">

            <div class="person-card" onclick="showPerson('Roby')">

                <div class="person-header">
                    <div class="person-name">🔧 Roby</div>
                    <div class="person-icon">R</div>
                </div>

                <div class="person-money" id="robyMoney">
                    € 0,00
                </div>

                <div class="person-stats">
                    <span id="robyOrders">0 ordini</span>
                    <span id="robyArrived">0 arrivati</span>
                </div>

            </div>


            <div class="person-card" onclick="showPerson('Fede')">

                <div class="person-header">
                    <div class="person-name">🛠️ Fede</div>
                    <div class="person-icon">F</div>
                </div>

                <div class="person-money" id="fedeMoney">
                    € 0,00
                </div>

                <div class="person-stats">
                    <span id="fedeOrders">0 ordini</span>
                    <span id="fedeArrived">0 arrivati</span>
                </div>

            </div>

        </div>

    </section>


    <!-- TABLE -->

    <section class="table-box">

        <div class="table-header">

            <div class="table-title" id="tableTitle">
                Ultimi ordini
            </div>

            <input
                type="text"
                class="search"
                id="searchInput"
                placeholder="Cerca codice o articolo..."
                oninput="renderTable()"
            >

        </div>

        <div id="tableContainer"></div>

    </section>

</main>


<!-- MODAL -->

<div class="modal-overlay" id="modal">

    <div class="modal">

        <div class="modal-title">
            Nuovo ordine KTM
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Persona</label>

                <select id="person">
                    <option value="Roby">Roby</option>
                    <option value="Fede">Fede</option>
                </select>
            </div>


            <div class="form-group">
                <label>Data</label>

                <input type="date" id="date">
            </div>


            <div class="form-group">
                <label>Quantità</label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    value="1"
                    oninput="calculateNet()"
                >
            </div>


            <div class="form-group">
                <label>Codice / Articolo KTM</label>

                <input
                    type="text"
                    id="article"
                    placeholder="Es. 54839000000"
                >
            </div>


            <div class="form-group">
                <label>Listino (€)</label>

                <input
                    type="number"
                    id="listPrice"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                    oninput="calculateNet()"
                >
            </div>


            <div class="form-group">
                <label>Sconto (%)</label>

                <input
                    type="number"
                    id="discount"
                    min="0"
                    max="100"
                    step="0.01"
                    value="0"
                    oninput="calculateNet()"
                >
            </div>


            <div class="form-group">
                <label>Netto scontato</label>

                <input
                    type="text"
                    id="netPrice"
                    class="calculated"
                    readonly
                    value="€ 0,00"
                >
            </div>


            <div class="form-group">
                <label>Stato ordine</label>

                <select id="status">
                    <option value="Da ordinare">Da ordinare</option>
                    <option value="Ordinato">Ordinato</option>
                    <option value="Arrivato">Arrivato</option>
                    <option value="Consegnato">Consegnato</option>
                </select>
            </div>

        </div>


        <div class="modal-buttons">

            <button class="cancel-btn" onclick="closeModal()">
                Annulla
            </button>

            <button class="save-btn" onclick="saveOrder()">
                Salva ordine
            </button>

        </div>

    </div>

</div>


<script>

let orders = JSON.parse(localStorage.getItem("ktmOrders")) || [];

let editingId = null;

let currentPerson = null;


/* FORMATTA EURO */

function euro(value) {

    return new Intl.NumberFormat("it-IT", {
        style: "currency",
        currency: "EUR"
    }).format(Number(value) || 0);

}


/* CALCOLO NETTO */

function calculateNet() {

    const listino =
        parseFloat(document.getElementById("listPrice").value) || 0;

    const sconto =
        parseFloat(document.getElementById("discount").value) || 0;

    const netto =
        listino - (listino * sconto / 100);

    document.getElementById("netPrice").value =
        euro(netto);

}


/* SALVA */

function saveOrder() {

    const person =
        document.getElementById("person").value;

    const date =
        document.getElementById("date").value;

    const quantity =
        parseInt(document.getElementById("quantity").value) || 1;

    const article =
        document.getElementById("article").value.trim();

    const listPrice =
        parseFloat(document.getElementById("listPrice").value) || 0;

    const discount =
        parseFloat(document.getElementById("discount").value) || 0;

    const netPrice =
        listPrice - (listPrice * discount / 100);

    const status =
        document.getElementById("status").value;


    if (!date) {
        alert("Inserisci la data.");
        return;
    }

    if (!article) {
        alert("Inserisci il codice o l'articolo KTM.");
        return;
    }


    const order = {

        id: editingId || Date.now(),

        person: person,

        date: date,

        quantity: quantity,

        article: article,

        listPrice: listPrice,

        discount: discount,

        netPrice: netPrice,

        total: netPrice * quantity,

        status: status

    };


    if (editingId) {

        const index =
            orders.findIndex(o => o.id === editingId);

        if (index !== -1) {
            orders[index] = order;
        }

    } else {

        orders.push(order);

    }


    localStorage.setItem(
        "ktmOrders",
        JSON.stringify(orders)
    );


    closeModal();

    updateDashboard();

    renderTable();

}


/* APRI MODAL */

function openModal(order = null) {

    editingId = order ? order.id : null;

    document.getElementById("modal").classList.add("show");


    if (order) {

        document.getElementById("person").value =
            order.person;

        document.getElementById("date").value =
            order.date;

        document.getElementById("quantity").value =
            order.quantity;

        document.getElementById("article").value =
            order.article;

        document.getElementById("listPrice").value =
            order.listPrice;

        document.getElementById("discount").value =
            order.discount;

        document.getElementById("status").value =
            order.status;

        calculateNet();

    } else {

        document.getElementById("date").value =
            new Date().toISOString().split("T")[0];

        document.getElementById("quantity").value = 1;

        document.getElementById("article").value = "";

        document.getElementById("listPrice").value = "";

        document.getElementById("discount").value = 0;

        document.getElementById("status").value =
            "Da ordinare";

        calculateNet();

    }

}


/* CHIUDI MODAL */

function closeModal() {

    document.getElementById("modal").classList.remove("show");

    editingId = null;

}


/* ELIMINA */

function deleteOrder(id) {

    if (!confirm("Vuoi eliminare questo ordine?")) {
        return;
    }

    orders =
        orders.filter(order => order.id !== id);

    localStorage.setItem(
        "ktmOrders",
        JSON.stringify(orders)
    );

    updateDashboard();

    renderTable();

}


/* MODIFICA */

function editOrder(id) {

    const order =
        orders.find(o => o.id === id);

    if (order) {
        openModal(order);
    }

}


/* MOSTRA PERSONA */

function showPerson(person) {

    currentPerson = person;

    document.getElementById("dashboard").style.display = "none";

    document.getElementById("pageTitle").textContent =
        "Ordini " + person;

    document.getElementById("pageSubtitle").textContent =
        "Gestione completa degli ordini di " + person;

    document.getElementById("tableTitle").textContent =
        "Ordini di " + person;

    renderTable();

}


/* DASHBOARD */

function showDashboard() {

    currentPerson = null;

    document.getElementById("dashboard").style.display = "block";

    document.getElementById("pageTitle").textContent =
        "Gestione Ordini KTM";

    document.getElementById("pageSubtitle").textContent =
        "Controllo completo degli ordini di Roby e Fede";

    document.getElementById("tableTitle").textContent =
        "Ultimi ordini";

    renderTable();

}


/* TABELLA */

function renderTable() {

    const container =
        document.getElementById("tableContainer");

    const search =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();


    let filtered = [...orders];


    if (currentPerson) {

        filtered =
            filtered.filter(
                o => o.person === currentPerson
            );

    }


    if (search) {

        filtered =
            filtered.filter(o =>
                o.article.toLowerCase().includes(search)
                ||
                o.person.toLowerCase().includes(search)
                ||
                o.status.toLowerCase().includes(search)
            );

    }


    filtered.sort(
        (a,b) =>
        new Date(b.date) - new Date(a.date)
    );


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;margin-bottom:10px;">📦</div>
                Nessun ordine presente.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>DATA</th>
                    <th>PERSONA</th>
                    <th>QUANTITÀ</th>
                    <th>ARTICOLO</th>
                    <th>LISTINO</th>
                    <th>SCONTO</th>
                    <th>NETTO</th>
                    <th>TOTALE</th>
                    <th>STATO</th>
                    <th></th>

                </tr>

            </thead>

            <tbody>

    `;


    filtered.forEach(order => {

        const statusClass =
            order.status
            .toLowerCase()
            .replaceAll(" ", "-");


        html += `

            <tr>

                <td>
                    ${formatDate(order.date)}
                </td>

                <td>
                    <strong>${order.person}</strong>
                </td>

                <td>
                    ${order.quantity}
                </td>

                <td>
                    <strong>${escapeHTML(order.article)}</strong>
                </td>

                <td class="money">
                    ${euro(order.listPrice)}
                </td>

                <td>
                    ${order.discount}%
                </td>

                <td class="money">
                    ${euro(order.netPrice)}
                </td>

                <td class="money">
                    ${euro(order.total)}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${order.status}
                    </span>
                </td>

                <td class="actions">

                    <button onclick="editOrder(${order.id})">
                        ✏️
                    </button>

                    <button onclick="deleteOrder(${order.id})">
                        🗑️
                    </button>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML = html;

}


/* DATA */

function formatDate(date) {

    if (!date) return "-";

    const parts = date.split("-");

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* SICUREZZA HTML */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* DASHBOARD DATI */

function updateDashboard() {

    const total =
        orders.length;

    const toOrder =
        orders.filter(
            o => o.status === "Da ordinare"
        ).length;

    const arrived =
        orders.filter(
            o => o.status === "Arrivato"
        ).length;

    const delivered =
        orders.filter(
            o => o.status === "Consegnato"
        ).length;


    document.getElementById("totalOrders").textContent =
        total;

    document.getElementById("toOrder").textContent =
        toOrder;

    document.getElementById("arrived").textContent =
        arrived;

    document.getElementById("delivered").textContent =
        delivered;


    updatePerson("Roby");

    updatePerson("Fede");

}


/* DATI PERSONA */

function updatePerson(person) {

    const personOrders =
        orders.filter(
            o => o.person === person
        );


    const money =
        personOrders
        .filter(
            o => o.status !== "Consegnato"
        )
        .reduce(
            (sum, o) => sum + o.total,
            0
        );


    const arrived =
        personOrders.filter(
            o => o.status === "Arrivato"
        ).length;


    if (person === "Roby") {

        document.getElementById("robyMoney").textContent =
            euro(money);

        document.getElementById("robyOrders").textContent =
            personOrders.length + " ordini";

        document.getElementById("robyArrived").textContent =
            arrived + " arrivati";

    }


    if (person === "Fede") {

        document.getElementById("fedeMoney").textContent =
            euro(money);

        document.getElementById("fedeOrders").textContent =
            personOrders.length + " ordini";

        document.getElementById("fedeArrived").textContent =
            arrived + " arrivati";

    }

}


/* AVVIO */

updateDashboard();

renderTable();

</script>
