<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Gestione Ordini KTM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
button{font-family:inherit}
#home{min-height:100vh;background:#fff;display:flex;align-items:center;justify-content:center;padding:25px;position:relative;overflow:hidden}
.orange{position:absolute;background:#ff6600}
.o1{width:550px;height:170px;top:-90px;left:-150px;transform:rotate(-12deg)}
.o2{width:500px;height:160px;bottom:-90px;right:-150px;transform:rotate(-12deg)}
.home{width:100%;max-width:850px;text-align:center;position:relative;z-index:2}
.logo{font-size:80px;font-weight:900;font-style:italic;color:#ff6600}
.home h1{font-size:32px;margin-top:8px}
.home p{color:#777;margin-top:8px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:45px}
.person{background:#fff;border:1px solid #ddd;border-radius:25px;padding:35px;box-shadow:0 10px 35px #00000012}
.person:hover{border-color:#ff6600;transform:translateY(-3px)}
.avatar{width:75px;height:75px;margin:auto;border-radius:50%;background:#ff6600;color:white;display:flex;align-items:center;justify-content:center;font-size:32px}
.person h2{font-size:30px;margin-top:18px}
.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:bold;cursor:pointer}
.orangebtn{background:#ff6600;color:white}
.person .btn{width:100%;margin-top:22px}
#app{display:none;min-height:100vh}
.header{height:70px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.smalllogo{font-size:30px;font-weight:900;font-style:italic;color:#ff6600}
.headerRight{display:flex;align-items:center;gap:15px}
.exit{background:white;border:1px solid #ccc;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:28px 18px}
.page{display:none}.page.active{display:block}
.title{margin-bottom:22px}.title h1{font-size:31px}.title p{color:#777;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:white;border:1px solid #ddd;border-radius:15px;padding:18px}
.stat small{color:#777;font-weight:bold}.stat strong{display:block;font-size:22px;margin-top:8px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;display:flex;align-items:center;gap:15px;cursor:pointer}
.card:hover{border-color:#ff6600}
.icon{width:54px;height:54px;border-radius:13px;background:#fff0e8;color:#ff6600;display:flex;align-items:center;justify-content:center;font-size:24px}
.card p{color:#888;font-size:13px;margin-top:4px}.arrow{margin-left:auto;color:#ff6600;font-size:25px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{background:white;border:1px solid #ccc;border-radius:8px;padding:9px 14px;cursor:pointer;margin-bottom:18px}
.tablebox{background:white;border:1px solid #ddd;border-radius:15px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:950px}
th{background:#fafafa;color:#777;font-size:11px;text-align:left;padding:12px}
td{padding:11px 12px;border-top:1px solid #eee;font-size:13px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;color:#555;font-size:10px;font-weight:bold}
.modalbg{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:20px}
.modalbg.open{display:flex}.modal{background:white;border-radius:20px;padding:24px;width:650px;max-width:100%}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}
.field label{font-size:11px;color:#666;font-weight:bold}
.field input,.field select{padding:11px;border:1px solid #ccc;border-radius:8px}
.summary{background:#fff1e8;padding:14px;border-radius:12px;margin-top:18px}
.sumrow{display:flex;justify-content:space-between;padding:5px 0}.sumtotal{border-top:1px solid #ffd0b8;margin-top:7px;padding-top:10px;font-weight:bold}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.cancel{background:#eee;border:0;border-radius:8px;padding:12px;cursor:pointer;font-weight:bold}
@media(max-width:700px){.logo{font-size:60px}.people,.menu{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
