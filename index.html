<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 25px;
    }

    .header {
        background: linear-gradient(135deg, #087f3f, #0ba85a);
        color: white;
        padding: 25px;
        border-radius: 18px;
        margin-bottom: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    .header p {
        margin: 0;
        opacity: .9;
    }

    .tools {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    #search {
        flex: 1;
        min-width: 250px;
        padding: 15px 18px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        background: white;
    }

    #search:focus {
        border-color: #087f3f;
        box-shadow: 0 0 0 3px rgba(8,127,63,.12);
    }

    .counter {
        background: white;
        padding: 15px 18px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        font-weight: bold;
        white-space: nowrap;
    }

    .ricambi {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
    }

    .ricambio {
        background: white;
        border-radius: 14px;
        padding: 16px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 2px 8px rgba(0,0,0,.05);
        transition: .2s;
    }

    .ricambio:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,.10);
    }

    .codice {
        font-size: 18px;
        font-weight: bold;
        color: #087f3f;
        word-break: break-word;
    }

    .info {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        font-size: 13px;
        color: #6b7280;
    }

    .quantita {
        font-weight: bold;
        color: #111827;
    }

    .riga {
        color: #9ca3af;
    }

    .vuoto {
        display: none;
        background: white;
        border-radius: 14px;
        padding: 30px;
        text-align: center;
        color: #6b7280;
    }

    @media (max-width: 600px) {
        .container {
            padding: 12px;
        }

        .header h1 {
            font-size: 23px;
        }

        .ricambi {
            grid-template-columns: 1fr;
        }

        .counter {
            width: 100%;
            text-align: center;
        }
    }
</style>
</head>

<body>

/*
=========================================================
   VISUALIZZAZIONE
=========================================================
*/

function mostraRicambi(lista = ricambiRoby) {

    const contenitore = document.getElementById("ricambi");
    const vuoto = document.getElementById("vuoto");
    const counter = document.getElementById("counter");

    contenitore.innerHTML = "";

    counter.textContent =
        "Ricambi visualizzati: " + lista.length;

    if (lista.length === 0) {
        vuoto.style.display = "block";
        return;
    }

    vuoto.style.display = "none";

    lista.forEach((ricambio) => {

        const div = document.createElement("div");

        div.className = "ricambio";

        div.innerHTML = `
            <div class="codice">
                ${ricambio.codice}
            </div>

            <div class="info">

                <span class="riga">
                    Riga ${ricambio.riga}
                </span>

                ${
                    ricambio.quantita !== undefined
                    ?
                    `<span class="quantita">
                        Quantità: ${ricambio.quantita}
                    </span>`
                    :
                    ""
                }

            </div>
        `;

        contenitore.appendChild(div);

    });
}


/*
=========================================================
   RICERCA
=========================================================
*/

function cercaRicambio() {

    const testo =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    if (testo === "") {
        mostraRicambi(ricambiRoby);
        return;
    }

    const risultati = ricambiRoby.filter(ricambio =>

        ricambio.codice
        .toLowerCase()
        .includes(testo)

    );

    mostraRicambi(risultati);
}


/*
=========================================================
   AVVIO
=========================================================
*/

mostraRicambi();
